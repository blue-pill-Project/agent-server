[project]
name = "agent-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.52",
    "bs4>=0.0.2",
    "chromium>=0.0.0",
    "fastapi[standard]>=0.139.2",
    "langchain-openai>=1.3.5",
    "langchain-openrouter>=0.2.6",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "numpy>=2.5.2",
    "playwright>=1.61.0",
    "psycopg>=3.3.4",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
